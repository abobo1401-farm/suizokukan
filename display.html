const db  = getDatabase(app);

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
// 魚が泳ぐ範囲（画面中央の正方形）
let AX = 0, AY = 0, AS = 0;
const ax = t => AX + AS * t;          // 範囲内の横位置（0〜1）
const ay = t => AY + AS * t;          // 範囲内の縦位置（0〜1）
function resize(){
  const dpr = 1;                       // OBSは等倍でよい（負荷軽減）
  W = cv.width  = Math.floor(window.innerWidth  * dpr);
  H = cv.height = Math.floor(window.innerHeight * dpr);
  AS = Math.min(W, H);
  AX = (W - AS) / 2;
  AY = (H - AS) / 2;
}
window.addEventListener('resize', resize);
resize();

const SOUND = new URLSearchParams(location.search).get('sound') === '1';
const fx = [];
let actx = null;

function splash(x, y, sc){
  fx.push({ t:'ring', x, y, life:0, dur:0.75, r0:12*sc, r1:105*sc });
  fx.push({ t:'ring', x, y, life:-0.14, dur:0.7, r0:6*sc, r1:62*sc });
  for (let i = 0; i < 18; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = (70 + Math.random() * 190) * sc;
    fx.push({ t:'spark', x, y, life:0, dur:0.5 + Math.random()*0.5,
              vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 90*sc, sz:(2+Math.random()*3.4)*sc });
  }
  if (SOUND) chapon();
}

function chapon(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(820, t);
    o.frequency.exponentialRampToValueAtTime(170, t + 0.13);
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + 0.24);
    // キラキラ
    const o2 = actx.createOscillator(), g2 = actx.createGain();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(1800, t + 0.06);
    o2.frequency.exponentialRampToValueAtTime(3200, t + 0.3);
    g2.gain.setValueAtTime(0.0001, t + 0.06);
    g2.gain.exponentialRampToValueAtTime(0.07, t + 0.12);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o2.connect(g2).connect(actx.destination);
    o2.start(t + 0.06); o2.stop(t + 0.42);
  }catch(e){}
}

function drawFx(dt){
  for (let i = fx.length - 1; i >= 0; i--){
    const p = fx[i];
    p.life += dt;
    if (p.life < 0) continue;
    const u = p.life / p.dur;
    if (u >= 1){ fx.splice(i, 1); continue; }
    ctx.save();
    if (p.t === 'ring'){
      const r = p.r0 + (p.r1 - p.r0) * (1 - Math.pow(1 - u, 3));
      ctx.globalAlpha = (1 - u) * 0.75;
      ctx.strokeStyle = '#dff6ff';
      ctx.lineWidth = Math.max(1.5, 5 * (1 - u));
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, r, r * 0.42, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      ctx.globalAlpha = (1 - u);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      const s = p.sz * (1 - u * 0.5);
      ctx.moveTo(p.x, p.y - s*2); ctx.lineTo(p.x + s, p.y);
      ctx.lineTo(p.x, p.y + s*2); ctx.lineTo(p.x - s, p.y);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

const ABILITIES = {
  ganjou:  {name:'がんじょう',   desc:'障害物で止まらない'},
  taishoku:{name:'たいしょく',   desc:'エサで足止めされない'},
  surinuke:{name:'すりぬけ',     desc:'釣り針から逃げられる'},
  rocket:  {name:'ロケット',     desc:'スタート直後に加速'},
  makezu:  {name:'まけずぎらい', desc:'負けているほど速くなる'},
  oikomi:  {name:'おいこみ',     desc:'ラストで加速'},
  gurume:  {name:'ダッシュ',     desc:'赤りんごの効果が強い'},
  lucky:   {name:'幸運',         desc:'金のりんごが出やすい'}
};
const ABILITY_KEYS = Object.keys(ABILITIES);
function strHash(str, salt){
  let x = 2166136261 >>> 0; const s2 = String(str) + '|' + salt;
  for (let i = 0; i < s2.length; i++){ x ^= s2.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; }
  return x >>> 0;
}
function autoAbilities(fid){
  const n = [0,1,1,1,2,2][strHash(fid,'n') % 6];
  return ABILITY_KEYS.slice().sort((a,b) => strHash(fid,a) - strHash(fid,b)).slice(0, n);
}
function abilitiesOf(id, stored){
  if (Array.isArray(stored)) return stored.filter(k => ABILITIES[k]);
  return autoAbilities(id || '');
}

const TURN_EVERY = { fuwa:[3,9], swim:[6,18], toko:[2,7] };   // 気まぐれUターンの間隔(秒)

function makeFish(id, d, img){
  const motion = d.motion || 'swim';
  const depth  = d.scale ?? 1;
  const mul    = (SIZE_MUL[d.size] ?? SIZE_MUL.m) * (d.grow ?? 1);
  const k = (AS / BASE_H) * mul * depth;
  const w = img.width  * k;
  const h = img.height * k;
  let [t0, t1] = TURN_EVERY[motion] || TURN_EVERY.swim;
  if (d.size === 'xl'){ t0 *= 2.2; t1 *= 2.2; }
  return {
    id, img, motion, name: d.name || '', w, h,
    x: AX + Math.random() * Math.max(1, AS - w),
    y: ay(d.y ?? 0.5),
    dir: d.dir ?? 1,
    face: d.face ?? -1,                   // 絵が向いている方向（既定は左向き）
    speed: (d.speed ?? 30) * (AS / BASE_H) * (d.spd ?? 1)
           * Math.pow(0.94, Math.max(0, Math.round(Math.log(d.grow ?? 1) / Math.log(1.22)))),
    vy: (Math.random() < .5 ? -1 : 1) * (4 + Math.random() * 7) * (AS / BASE_H),
    phase: Math.random() * Math.PI * 2,
    bob: (6 + Math.random() * 10) * (AS / BASE_H),
    depth, mul, grow: d.grow ?? 1, spd: d.spd ?? 1, meals: d.meals ?? 0, alpha: 0,
    turnRange: [t0, t1],
    turnCool: t0 + Math.random() * (t1 - t0),
    drop: 0, dropped: true
  };
}

/* ---------- Firebase ---------- */
let fishRef = ref(db, `aquarium/tanks/${TANK}/fish`);
let baitRef = ref(db, `aquarium/tanks/${TANK}/bait`);
let offFish = [], offBait = null;

let ready = false;   // 初回読み込みが終わったか

async function addFish(id, d){
  if (!d || !d.img || fishes.has(id)) return;
  const img = new Image();
  img.src = d.img;
  try { await img.decode(); } catch { return; }   // ← 画像が確実に読めてから登録
  if (fishes.has(id)) return;
  const f = makeFish(id, d, img);
  f.y = Math.max(AY + f.h / 2, Math.min(AY + AS - f.h / 2, f.y));   // 上下がはみ出さないように
  fishMeta.set(id, { ts: d.ts, size: d.size || 'm', motion: d.motion || 'swim',
                     abil: abilitiesOf(id, d.abilities) });
  if (ready){                                     // 新しく投入された魚だけ演出する
    f.landY = f.y;
    f.y = -f.h * 0.8;
    f.drop = 0; f.dropped = false;
    f.alpha = 1;
  }
  fishes.set(id, f);
}

async function switchTank(tank){
  TANK = String(tank);
  offFish.forEach(fn => fn && fn());
  offFish = [];
  ready = false;
  fishes.clear();
  bait = null;
  fishRef = ref(db, `aquarium/tanks/${TANK}/fish`);
  baitRef = ref(db, `aquarium/tanks/${TANK}/bait`);

  const initial = await get(fishRef);
  if (initial.exists()){
    await Promise.all(Object.entries(initial.val()).map(([id, d]) => addFish(id, d)));
  }
  ready = true;
  offFish.push(onChildAdded(fishRef, s => addFish(s.key, s.val())));
  offFish.push(onValue(fishRef, s => {              // grow の変化を反映
    const v = s.val() || {};
    for (const [id, d] of Object.entries(v)){
      const f = fishes.get(id);
      if (!f) continue;
      const g = d.grow ?? 1;
      if (Math.abs(g - f.grow) < 0.001) continue;
      const r = g / f.grow;
      f.w *= r; f.h *= r; f.mul *= r; f.grow = g;
      f.pop = 0;
    }
  }));
  offFish.push(onChildRemoved(fishRef, s => {
    const f = fishes.get(s.key);
    if (f) f.dying = true;             // フェードアウトしてから消す
  }));
  subscribeBait();
  banner = { text: `水槽 ${TANK}`, life: 0 };
}

await switchTank(TANK);

// tank指定がなければ管理画面の選択に追従する
if (!FIXED_TANK){
  onValue(ref(db, 'aquarium/view/tank'), s => {
    const t = s.val();
    if (t && String(t) !== TANK) switchTank(t);
  });
}

/* ---------- エサ ---------- */
function subscribeBait(){
  if (offBait) offBait();
  offBait = onValue(baitRef, s => {
  const v = s.val();
  if (!v || !v.type){ if (bait) bait.dying = true; return; }
  if (bait && bait.ts === v.ts) return;
  if (v.img && !baitImgs['custom:' + v.ts]){
    const im = new Image(); im.src = v.img; baitImgs['custom:' + v.ts] = im;
  }
  bait = {
    type: v.type, ts: v.ts, forId: v.forId || null,
    imgKey: v.img ? ('custom:' + v.ts) : v.type,
    eaten: false,
    x: ax(v.x ?? 0.5),
    y: AY - 0.15 * AS,
    landY: (() => {
      const tf = v.forId ? fishes.get(v.forId) : null;
      if (tf) return Math.max(ay(0.1), Math.min(ay(0.85), tf.y));
      const b = (BAIT_INFO[v.type] || BAIT_INFO.worm).band;
      return ay(b[0] + Math.random() * (b[1] - b[0])); })(),
    age: 0, alpha: 0, dying: false, cleared: false,
    phase: Math.random() * 6.28
  };
  });
}

/* ---------- 食べて大きくなる ---------- */
const GROW = 1.22;   // 1回で何倍になるか

const SPD  = 1.16;   // すばやさが上がる倍率

function eatAndGrow(f, bx, by, k){
  const bigger = Math.random() < 0.5;
  const meals = (f.meals ?? 0) + 1;
  f.meals = meals;
  const upd = { meals };

  if (bigger){
    const grow = (f.grow ?? 1) * GROW;
    f.grow = grow; upd.grow = grow;
    f.w *= GROW; f.h *= GROW; f.mul *= GROW;
    f.speed *= 0.94;
    f.pop = 0;
    f.gained = { text: 'ひとまわり大きくなった！', life: 0, color: '#ffd166' };
  } else {
    const sp = (f.spd ?? 1) * SPD;
    f.spd = sp; upd.spd = sp;
    f.speed *= SPD;
    f.dash = 0;
    f.gained = { text: 'すばやさが上がった！', life: 0, color: '#8fe3d6' };
  }

  fx.push({ t:'ring', x:bx, y:by, life:0, dur:0.6, r0:14*k, r1:90*k });
  for (let i = 0; i < 14; i++){
    const a = Math.random() * Math.PI * 2, s2 = (60 + Math.random()*150) * k;
    fx.push({ t:'spark', x:bx, y:by, life:0, dur:0.5 + Math.random()*0.4,
              vx: Math.cos(a)*s2, vy: Math.sin(a)*s2 - 70*k, sz:(2+Math.random()*3)*k });
  }
  if (SOUND) nomnom(bigger);
  gainMsg = { text: f.gained.text, color: f.gained.color, name: f.name || '', life: 0 };
  update(ref(db, `aquarium/tanks/${TANK}/fish/${f.id}`), upd).catch(()=>{});
  remove(baitRef).catch(()=>{});
}

function nomnom(bigger = true){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    [0, 0.13].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(180 - i*30, t + d);
      g.gain.setValueAtTime(0.09, t + d);
      g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.09);
      o.connect(g).connect(actx.destination);
      o.start(t + d); o.stop(t + d + 0.1);
    });
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(bigger ? 620 : 900, t + 0.28);
    o.frequency.exponentialRampToValueAtTime(bigger ? 1300 : 2200, t + 0.5);
    g.gain.setValueAtTime(0.0001, t + 0.28);
    g.gain.exponentialRampToValueAtTime(0.11, t + 0.34);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g).connect(actx.destination);
    o.start(t + 0.28); o.stop(t + 0.62);
  }catch(e){}
}

/* ---------- クリックで拡大表示 ---------- */
cv.style.pointerEvents = 'auto';
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) * (W / r.width);
  const py = (e.clientY - r.top)  * (H / r.height);

  if (detail){
    if (feedBtn && !detail.closing &&
        px > feedBtn.x && px < feedBtn.x + feedBtn.w &&
        py > feedBtn.y && py < feedBtn.y + feedBtn.h){
      feed(detail.f);
      return;
    }
    detail.closing = true;
    return;
  }

  // 手前（大きい）から順に当たり判定
  const list = [...fishes.values()].sort((a, b) => b.depth - a.depth);
  for (const f of list){
    if (!f.dropped || f.dying) continue;
    const cx = f.x + f.w / 2, cy = f.lastY ?? f.y;
    if (Math.abs(px - cx) < f.w / 2 && Math.abs(py - cy) < f.h / 2){
      detail = { f, life: 0, closing: false };
      return;
    }
  }
});

let feedBtn = null;      // { x, y, w, h } 拡大中のエサボタン領域
let feedMsg = null;      // { text, life }
let gainMsg = null;      // 成長結果の表示

function randomBait(){
  const keys = Object.keys(customBaits);
  if (keys.length){
    const k = keys[Math.floor(Math.random() * keys.length)];
    return { type: k, name: customBaits[k].name, img: customBaits[k].img };
  }
  const base = [['worm','ミミズ'],['apple','りんご'],['meat','おにく']];
  const b = base[Math.floor(Math.random() * base.length)];
  return { type: b[0], name: b[1], img: null };
}

async function feed(f){
  const b = randomBait();
  const payload = { type: b.type, x: 0.5, ts: Date.now(), forId: f.id };
  if (b.img) payload.img = b.img;
  try{
    await set(ref(db, `aquarium/tanks/${TANK}/bait`), payload);
    feedMsg = { text: `${b.name} をあげました`, life: 0 };
    if (detail) detail.closing = true;
  }catch(e){
    feedMsg = { text: 'エサをあげられませんでした', life: 0 };
  }
}

const SIZE_LABEL = { s:'小', m:'中', l:'大', xl:'特大' };
const MOTION_LABEL = { fuwa:'フワフワ', swim:'スイスイ', toko:'トコトコ' };

function drawDetail(dt){
  if (!detail){ feedBtn = null; return; }
  detail.life += detail.closing ? -dt * 3.5 : dt * 3.5;
  if (detail.life <= 0 && detail.closing){ detail = null; feedBtn = null; return; }
  const u = Math.min(1, detail.life);
  const e = 1 - Math.pow(1 - u, 3);
  const f = detail.f;
  const m = fishMeta.get(f.id) || {};
  const k = AS / BASE_H;

  ctx.save();
  ctx.globalAlpha = e * 0.76;
  ctx.fillStyle = '#02141f';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // ---- 魚を上寄せで表示（以前より小さめ）----
  const maxW = W * 0.34, maxH = H * 0.28;
  const sc = Math.min(maxW / f.img.width, maxH / f.img.height);
  const dw = f.img.width * sc * e, dh = f.img.height * sc * e;
  const cy = H * 0.20;
  ctx.save();
  ctx.globalAlpha = e;
  ctx.translate(W / 2, cy);
  if (f.face === 1) ctx.scale(-1, 1);
  ctx.drawImage(f.img, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = e;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  // ---- 名前 ----
  let y = H * 0.345;
  ctx.font = `800 ${Math.round(40 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
  ctx.lineWidth = 8 * k; ctx.strokeStyle = 'rgba(2,20,32,.9)';
  ctx.fillStyle = '#ffffff';
  ctx.strokeText(f.name || '(なまえなし)', W / 2, y);
  ctx.fillText(f.name || '(なまえなし)', W / 2, y);

  // ---- ゲージ ----
  const gw = Math.min(W * 0.52, 460 * k), gx = W / 2 - gw / 2, gh = 20 * k;
  const spd = f.spd ?? 1, grow = f.grow ?? 1;
  const spdPct = Math.max(0.06, Math.min(1, (spd - 1) / 1.6 + 0.18));   // すばやさ
  const durPct = Math.max(0.06, Math.min(1, (grow - 1) / 1.6 + 0.18));  // たいきゅう
  const bars = [
    ['スピード',  spdPct, '#8fe3d6', spd  > 1.01 ? `×${spd.toFixed(2)}`  : 'ふつう'],
    ['たいきゅう', durPct, '#ffd166', grow > 1.01 ? `×${grow.toFixed(2)}` : 'ふつう']
  ];
  y = H * 0.395;
  bars.forEach(([label, pct, col, val]) => {
    ctx.textAlign = 'left';
    ctx.font = `700 ${Math.round(21 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
    ctx.lineWidth = 5 * k; ctx.strokeStyle = 'rgba(2,20,32,.9)'; ctx.fillStyle = '#cfeaf7';
    ctx.strokeText(label, gx, y); ctx.fillText(label, gx, y);
    ctx.textAlign = 'right';
    ctx.strokeText(val, gx + gw, y); ctx.fillText(val, gx + gw, y);
    // 枠
    const by2 = y + 9 * k;
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    roundRect(gx, by2, gw, gh, gh / 2); ctx.fill();
    // 中身
    ctx.fillStyle = col;
    roundRect(gx, by2, Math.max(gh, gw * pct * e), gh, gh / 2); ctx.fill();
    y += 62 * k;
  });

  // ---- 特殊能力 ----
  ctx.textAlign = 'center';
  const abil = m.abil || [];
  y += 4 * k;
  ctx.font = `700 ${Math.round(20 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
  ctx.lineWidth = 5 * k; ctx.strokeStyle = 'rgba(2,20,32,.9)'; ctx.fillStyle = '#9fd8ea';
  ctx.strokeText('とくしゅのうりょく', W / 2, y); ctx.fillText('とくしゅのうりょく', W / 2, y);
  y += 34 * k;
  if (!abil.length){
    ctx.font = `600 ${Math.round(22 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.fillText('なし', W / 2, y);
    y += 34 * k;
  } else if (abil.length <= 2){
    // 2つまでは説明つきで見せる
    abil.forEach(key => {
      const a = ABILITIES[key];
      ctx.font = `800 ${Math.round(24 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
      ctx.lineWidth = 6 * k; ctx.strokeStyle = 'rgba(2,20,32,.9)'; ctx.fillStyle = '#ffe9a8';
      const t = a.name;
      ctx.strokeText(t, W / 2, y); ctx.fillText(t, W / 2, y);
      ctx.font = `500 ${Math.round(17 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
      ctx.lineWidth = 4 * k; ctx.fillStyle = 'rgba(207,234,247,.8)';
      ctx.strokeText(a.desc, W / 2, y + 23 * k); ctx.fillText(a.desc, W / 2, y + 23 * k);
      y += 56 * k;
    });
  } else {
    // 3つ以上は名前だけを2列で並べる
    ctx.font = `800 ${Math.round(21 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
    ctx.lineWidth = 5 * k; ctx.strokeStyle = 'rgba(2,20,32,.9)'; ctx.fillStyle = '#ffe9a8';
    const colW = Math.min(W * 0.30, 280 * k);
    for (let i = 0; i < abil.length; i += 2){
      const pair = abil.slice(i, i + 2);
      pair.forEach((key, j) => {
        const a = ABILITIES[key];
        const cx = pair.length === 1 ? W / 2 : W / 2 + (j === 0 ? -colW / 2 : colW / 2);
        const t = a.name;
        ctx.strokeText(t, cx, y); ctx.fillText(t, cx, y);
      });
      y += 32 * k;
    }
  }

  // ---- そのほかの情報 ----
  const d = m.ts ? new Date(m.ts) : null;
  const dateTxt = d
    ? `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
    : '不明';
  const info = `${SIZE_LABEL[m.size] || '中'}サイズ・${MOTION_LABEL[m.motion] || 'スイスイ'}　🍽${f.meals ?? 0}こ　${dateTxt}`;
  y += 6 * k;
  ctx.font = `500 ${Math.round(18 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
  ctx.lineWidth = 4 * k; ctx.strokeStyle = 'rgba(2,20,32,.9)'; ctx.fillStyle = 'rgba(207,234,247,.85)';
  ctx.strokeText(info, W / 2, y); ctx.fillText(info, W / 2, y);
  ctx.restore();

  // ---- エサをあげるボタン（画面下部に固定）----
  const bw = Math.min(W * 0.44, 320 * k), bh = 64 * k;
  const bx = W / 2 - bw / 2, by = Math.max(y + 26 * k, H - 128 * k);
  feedBtn = detail.closing ? null : { x: bx, y: by, w: bw, h: bh };
  ctx.save();
  ctx.globalAlpha = e;
  roundRect(bx, by, bw, bh, 18 * k);
  ctx.fillStyle = '#ff7a5c'; ctx.fill();
  ctx.lineWidth = 3 * k; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke();
  ctx.fillStyle = '#2a0a04';
  ctx.font = `800 ${Math.round(26 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🍎 エサをあげる', W / 2, by + bh / 2);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = e * 0.55;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = `500 ${Math.round(17 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
  ctx.lineWidth = 4 * k;
  ctx.strokeStyle = 'rgba(2,20,32,.9)'; ctx.fillStyle = '#ffffff';
  const cl = 'そのほかの場所をクリックでとじる';
  ctx.strokeText(cl, W / 2, H - 34 * k);
  ctx.fillText(cl, W / 2, H - 34 * k);
  ctx.restore();
}

function roundRect(x, y, w, h, r){
  r = Math.min(r, h / 2, w / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- アニメーション ---------- */
let prev = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  ctx.clearRect(0, 0, W, H);

  // エサの更新
  let baitPos = null, baitTarget = null, baitFor = null;
  if (bait){
    bait.age += dt;
    const k = H / BASE_H;
    const info = BAIT_INFO[bait.type] || BAIT_INFO.worm;
    if (bait.y < bait.landY){
      bait.y = Math.min(bait.landY, bait.y + info.fall * k * dt);
      if (bait.y >= bait.landY && !bait.splashed){ bait.splashed = true; splash(bait.x, bait.y, k); }
    } else if (info.sink && !bait.forId){
      bait.y = Math.min(ay(0.88), bait.y + info.sink * k * dt);
    }
    bait.phase += dt * 1.3;
    if (bait.age > BAIT_LIFE && !bait.dying){
      bait.dying = true;
      if (!bait.cleared){ bait.cleared = true; remove(baitRef).catch(()=>{}); }
    }
    bait.alpha = bait.dying ? bait.alpha - dt * 0.8 : Math.min(1, bait.alpha + dt * 2);
    if (bait.alpha <= 0){ bait = null; }
    else {
      const img = baitImgs[bait.imgKey] || baitImgs[bait.type];
      const bw = (img?.width  || 160) * k * 0.9;
      const bh = (img?.height || 160) * k * 0.9;
      const bx = bait.x + Math.sin(bait.phase) * 9 * k;
      if (!bait.dying && !bait.eaten){
        baitPos = { x: bx, y: bait.y };
        baitTarget = (BAIT_INFO[bait.type] || BAIT_INFO.worm).target;
        baitFor = bait.forId;
      }
      if (img && img.complete){
        ctx.save();
        ctx.globalAlpha = Math.max(0, bait.alpha);
        ctx.translate(bx, bait.y);
        ctx.rotate(Math.sin(bait.phase * 0.8) * 0.14);
        ctx.drawImage(img, -bw / 2, -bh / 2, bw, bh);
        ctx.restore();
      }
    }
  }

  // 奥（小さい）から手前（大きい）の順に描く
  const list = [...fishes.values()].sort((a, b) => a.depth - b.depth);

  for (const f of list){
    // フェード
    if (f.dying){
      f.alpha -= dt * 1.6;
      if (f.alpha <= 0){ fishes.delete(f.id); continue; }
    } else if (f.alpha < 1){
      f.alpha = Math.min(1, f.alpha + dt * 0.8);
    }

    // 投入時の落下
    if (!f.dropped){
      f.drop += dt / 0.75;
      if (f.drop >= 1){
        f.drop = 1; f.dropped = true; f.y = f.landY;
        splash(f.x + f.w / 2, f.landY, (AS / BASE_H) * f.mul);
      } else {
        const e = 1 - Math.pow(1 - f.drop, 3);
        f.y = -f.h * 0.8 + (f.landY + f.h * 0.8) * e;
      }
    }

    // 横移動（エサがあれば群がる）
    const chasing = !!baitPos && f.dropped &&
      (baitFor ? f.id === baitFor : f.motion === baitTarget);
    let nibbling = false;
    if (chasing){
      const k = H / BASE_H;
      if (baitFor){ f.ox = 0; f.oy = 0; }
      else {
        f.reOff = (f.reOff ?? 0) - dt;
        if (f.reOff <= 0){                     // たまに位置取りを変える
          f.ox = (Math.random() - 0.5) * 190 * k * f.mul;
          f.oy = (Math.random() - 0.5) * 130 * k * f.mul;
          f.reOff = 1.4 + Math.random() * 2.2;
        }
      }
      const cx = f.x + f.w / 2;
      const tx = baitPos.x + f.ox;
      const ty = (f.motion === 'toko' && !baitFor) ? f.y : baitPos.y + f.oy;
      const dx = tx - cx, dy = ty - f.y;
      const dist = Math.hypot(dx, dy) || 1;
      const sp = f.speed * (f.motion === 'fuwa' ? 2.0 : 2.7);
      const ease = Math.min(1, dist / (70 * k));
      f.x += (dx / dist) * sp * ease * dt;
      if (f.motion !== 'toko' || baitFor){
        f.y += (dy / dist) * sp * ease * dt;
        f.y = Math.max(AY + f.h / 2, Math.min(AY + AS - f.h / 2, f.y));
      }
      if (Math.abs(dx) > 3 * k) f.dir = dx > 0 ? 1 : -1;
      if (dist < 90 * k){
        nibbling = true; f.nib = (f.nib ?? 0) + dt * 13;
        if (baitFor && bait && !bait.eaten){
          bait.eatT = (bait.eatT ?? 0) + dt;
          if (bait.eatT > 1.6){                // 1.6秒つついたら完食
            bait.eaten = true; bait.dying = true;
            eatAndGrow(f, bait.x, bait.y, k);
          }
        }
      }
      f.x = Math.max(AX, Math.min(AX + AS - f.w, f.x));
    } else {
      f.x += f.speed * f.dir * dt;
      if (f.x < AX){ f.x = AX; f.dir = 1; }
      if (f.x > AX + AS - f.w){ f.x = AX + AS - f.w; f.dir = -1; }

      // 気まぐれUターン
      f.turnCool -= dt;
      if (f.turnCool <= 0){
        const [t0, t1] = f.turnRange;
        f.turnCool = t0 + Math.random() * (t1 - t0);
        if (Math.random() < 0.4) f.dir *= -1;
      }
    }

    // 動きの種類ごとの縦運動・変形
    let yOff = 0, rot = 0, sx = 1, sy = 1;
    if (f.motion === 'fuwa'){
      // ふわふわ漂う：大きく上下し、伸び縮みしながらゆっくり傾く
      f.phase += dt * 0.65;
      if (!chasing){
        f.y += f.vy * dt;
        const yMin = AY + f.h / 2 + f.bob * 2.4, yMax = AY + AS * 0.72 - f.h / 2;
        if (f.y < yMin){ f.y = yMin; f.vy = Math.abs(f.vy); }
        if (f.y > yMax){ f.y = yMax; f.vy = -Math.abs(f.vy); }
      }
      yOff = Math.sin(f.phase) * f.bob * (chasing ? 0.5 : 2.4);
      sy = 1 + Math.sin(f.phase * 2) * 0.08;
      sx = 1 - Math.sin(f.phase * 2) * 0.05;
      rot = Math.sin(f.phase * 0.55) * 0.12;
    } else if (f.motion === 'toko'){
      // とことこ歩く：地面に沿って小刻みに跳ねる
      f.phase += dt * (chasing ? 10 : 7);
      yOff = -Math.abs(Math.sin(f.phase)) * f.h * 0.07;
      rot = Math.sin(f.phase) * 0.05;
    } else {
      // すいすい泳ぐ
      f.phase += dt * (chasing ? 2.2 : 0.9);
      yOff = Math.sin(f.phase) * f.bob * (chasing ? 0.45 : 1);
    }
    if (nibbling){ yOff += Math.sin(f.nib) * f.h * 0.04; rot += Math.sin(f.nib * 0.5) * 0.06; }
    if (f.dash !== undefined && f.dash < 1){
      f.dash = Math.min(1, f.dash + dt * 1.2);
      const w2 = 1 + Math.sin(f.dash * Math.PI) * 0.22;
      sx *= w2; sy /= w2;
    }
    if (f.pop !== undefined && f.pop < 1){
      f.pop = Math.min(1, f.pop + dt * 1.8);
      const p = 1 + Math.sin(f.pop * Math.PI) * 0.28;
      sx *= p; sy *= p;
    }
    const y = f.y + yOff;
    f.lastY = y;

    // 描画（フワフワは左右反転せず、傾きで向きを表現）
    ctx.save();
    ctx.globalAlpha = f.alpha * (0.6 + 0.4 * Math.min(1, f.depth));
    ctx.translate(f.x + f.w / 2, y);
    if (rot) ctx.rotate(rot);
    if (f.motion !== 'fuwa' && f.dir !== f.face) ctx.scale(-1, 1);
    ctx.scale(sx, sy);
    ctx.drawImage(f.img, -f.w / 2, -f.h / 2, f.w, f.h);
    ctx.restore();

    // 名前
    if (SHOW_NAMES && f.name){
      ctx.save();
      ctx.globalAlpha = f.alpha;
      const fs = Math.max(13, Math.round(20 * (AS / BASE_H) * f.depth));
      ctx.font = `700 ${fs}px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.lineWidth = Math.max(2, fs * 0.22);
      ctx.strokeStyle = 'rgba(2,20,32,.85)';
      ctx.fillStyle = '#eaf7ff';
      const tx = f.x + f.w / 2, ty = y + f.h / 2 + 4;
      ctx.strokeText(f.name, tx, ty);
      ctx.fillText(f.name, tx, ty);
      ctx.restore();
    }
  }
  drawFx(dt);
  drawDetail(dt);

  // たべた結果
  if (gainMsg){
    gainMsg.life += dt;
    const u = gainMsg.life / 2.8;
    if (u >= 1) gainMsg = null;
    else {
      const k = H / BASE_H;
      const a = u < 0.1 ? u / 0.1 : (u > 0.72 ? (1 - u) / 0.28 : 1);
      const rise = Math.min(1, u / 0.25);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const y = H * 0.30 - rise * 22 * k;
      if (gainMsg.name){
        ctx.font = `700 ${Math.round(24 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
        ctx.lineWidth = 6 * k; ctx.strokeStyle = 'rgba(2,20,32,.85)';
        ctx.fillStyle = '#ffffff';
        ctx.strokeText(gainMsg.name, W / 2, y - 34 * k);
        ctx.fillText(gainMsg.name, W / 2, y - 34 * k);
      }
      ctx.font = `800 ${Math.round(40 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
      ctx.lineWidth = 9 * k; ctx.strokeStyle = 'rgba(2,20,32,.9)';
      ctx.fillStyle = gainMsg.color;
      ctx.strokeText(gainMsg.text, W / 2, y);
      ctx.fillText(gainMsg.text, W / 2, y);
      ctx.restore();
    }
  }

  // エサをあげた通知
  if (feedMsg){
    feedMsg.life += dt;
    const u = feedMsg.life / 2.4;
    if (u >= 1) feedMsg = null;
    else {
      const k = H / BASE_H;
      const a = u < 0.12 ? u / 0.12 : (u > 0.7 ? (1 - u) / 0.3 : 1);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.font = `800 ${Math.round(30 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 7 * k;
      ctx.strokeStyle = 'rgba(2,20,32,.85)';
      ctx.fillStyle = '#ffd166';
      ctx.strokeText(feedMsg.text, W / 2, H * 0.16);
      ctx.fillText(feedMsg.text, W / 2, H * 0.16);
      ctx.restore();
    }
  }

  // 水槽切り替えの表示
  if (banner){
    banner.life += dt;
    const u = banner.life / 2.2;
    if (u >= 1) banner = null;
    else {
      const a = u < 0.15 ? u / 0.15 : (u > 0.75 ? (1 - u) / 0.25 : 1);
      const k = H / BASE_H;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.font = `800 ${Math.round(34 * k)}px "Hiragino Maru Gothic ProN",sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 8 * k;
      ctx.strokeStyle = 'rgba(2,20,32,.8)';
      ctx.fillStyle = '#dff6ff';
      ctx.strokeText(banner.text, W / 2, 52 * k);
      ctx.fillText(banner.text, W / 2, 52 * k);
      ctx.restore();
    }
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

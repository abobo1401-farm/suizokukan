<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Aquarium Display</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onChildAdded, onChildRemoved, get }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ============================================================
   ★★★ draw.html と同じ firebaseConfig を貼り付け ★★★
   ============================================================ */
const firebaseConfig = {
  apiKey: "★ここにAPIキー★",
  authDomain: "utaoshi-ringo.firebaseapp.com",
  databaseURL: "https://utaoshi-ringo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "utaoshi-ringo",
  storageBucket: "utaoshi-ringo.appspot.com",
  messagingSenderId: "★★★",
  appId: "★★★"
};
/* ========================================================== */

const TANK       = new URLSearchParams(location.search).get('tank') || '1';
const SHOW_NAMES = new URLSearchParams(location.search).get('names') !== '0';
const BASE_H     = 1080;   // speed の基準解像度

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){
  const dpr = 1;                       // OBSは等倍でよい（負荷軽減）
  W = cv.width  = Math.floor(window.innerWidth  * dpr);
  H = cv.height = Math.floor(window.innerHeight * dpr);
}
window.addEventListener('resize', resize);
resize();

const fishes = new Map();   // id -> fish object

const SIZE_MUL   = { s:0.62, m:0.95, l:1.35 };
const TURN_EVERY = { fuwa:[3,9], swim:[6,18], toko:[2,7] };   // 気まぐれUターンの間隔(秒)

function makeFish(id, d, img){
  const motion = d.motion || 'swim';
  const depth  = d.scale ?? 1;
  const mul    = SIZE_MUL[d.size] ?? SIZE_MUL.m;
  const k = (H / BASE_H) * mul * depth;
  const w = img.width  * k;
  const h = img.height * k;
  const [t0, t1] = TURN_EVERY[motion] || TURN_EVERY.swim;
  return {
    id, img, motion, name: d.name || '', w, h,
    x: Math.random() * Math.max(1, W - w),
    y: (d.y ?? 0.5) * H,
    dir: d.dir ?? 1,
    speed: (d.speed ?? 30) * (H / BASE_H),
    vy: (Math.random() < .5 ? -1 : 1) * (4 + Math.random() * 7) * (H / BASE_H),
    phase: Math.random() * Math.PI * 2,
    bob: (6 + Math.random() * 10) * (H / BASE_H),
    depth, mul, alpha: 0,
    turnRange: [t0, t1],
    turnCool: t0 + Math.random() * (t1 - t0)
  };
}

/* ---------- Firebase ---------- */
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const fishRef = ref(db, `aquarium/tanks/${TANK}/fish`);

async function addFish(id, d){
  if (!d || !d.img || fishes.has(id)) return;
  const img = new Image();
  img.src = d.img;
  try { await img.decode(); } catch { return; }   // ← 画像が確実に読めてから登録
  if (fishes.has(id)) return;
  fishes.set(id, makeFish(id, d, img));
}

// await-first：既存分をすべて読み込んでから購読を開始する
const initial = await get(fishRef);
if (initial.exists()){
  const val = initial.val();
  await Promise.all(Object.entries(val).map(([id, d]) => addFish(id, d)));
}
onChildAdded(fishRef, s => addFish(s.key, s.val()));
onChildRemoved(fishRef, s => {
  const f = fishes.get(s.key);
  if (f) f.dying = true;               // フェードアウトしてから消す
});

/* ---------- アニメーション ---------- */
let prev = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  ctx.clearRect(0, 0, W, H);

  // 奥（小さい）から手前（大きい）の順に描く
  const list = [...fishes.values()].sort((a, b) => a.depth - b.depth);

  for (const f of list){
    // フェード
    if (f.dying){
      f.alpha -= dt * 1.6;
      if (f.alpha <= 0){ fishes.delete(f.id); continue; }
    } else if (f.alpha < 1){
      f.alpha = Math.min(1, f.alpha + dt * 0.8);
    }

    // 横移動
    f.x += f.speed * f.dir * dt;
    if (f.x < -f.w * 0.15){ f.x = -f.w * 0.15; f.dir = 1; }
    if (f.x > W - f.w * 0.85){ f.x = W - f.w * 0.85; f.dir = -1; }

    // 気まぐれUターン
    f.turnCool -= dt;
    if (f.turnCool <= 0){
      const [t0, t1] = f.turnRange;
      f.turnCool = t0 + Math.random() * (t1 - t0);
      if (Math.random() < 0.4) f.dir *= -1;
    }

    // 動きの種類ごとの縦運動・変形
    let yOff = 0, rot = 0, sx = 1, sy = 1;
    if (f.motion === 'fuwa'){
      // ふわふわ漂う：大きく上下し、伸び縮みしながらゆっくり傾く
      f.phase += dt * 0.65;
      f.y += f.vy * dt;
      if (f.y < H * 0.06){ f.y = H * 0.06; f.vy = Math.abs(f.vy); }
      if (f.y > H * 0.66){ f.y = H * 0.66; f.vy = -Math.abs(f.vy); }
      yOff = Math.sin(f.phase) * f.bob * 2.4;
      sy = 1 + Math.sin(f.phase * 2) * 0.08;
      sx = 1 - Math.sin(f.phase * 2) * 0.05;
      rot = Math.sin(f.phase * 0.55) * 0.12;
    } else if (f.motion === 'toko'){
      // とことこ歩く：地面に沿って小刻みに跳ねる
      f.phase += dt * 7;
      yOff = -Math.abs(Math.sin(f.phase)) * f.h * 0.07;
      rot = Math.sin(f.phase) * 0.05;
    } else {
      // すいすい泳ぐ
      f.phase += dt * 0.9;
      yOff = Math.sin(f.phase) * f.bob;
    }
    const y = f.y + yOff;

    // 描画（フワフワは左右反転せず、傾きで向きを表現）
    ctx.save();
    ctx.globalAlpha = f.alpha * (0.6 + 0.4 * Math.min(1, f.depth));
    ctx.translate(f.x + f.w / 2, y);
    if (rot) ctx.rotate(rot);
    if (f.motion !== 'fuwa' && f.dir < 0) ctx.scale(-1, 1);
    ctx.scale(sx, sy);
    ctx.drawImage(f.img, -f.w / 2, -f.h / 2, f.w, f.h);
    ctx.restore();

    // 名前
    if (SHOW_NAMES && f.name){
      ctx.save();
      ctx.globalAlpha = f.alpha;
      const fs = Math.max(13, Math.round(20 * (H / BASE_H) * f.depth));
      ctx.font = `700 ${fs}px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.lineWidth = Math.max(2, fs * 0.22);
      ctx.strokeStyle = 'rgba(2,20,32,.85)';
      ctx.fillStyle = '#eaf7ff';
      const tx = f.x + f.w / 2, ty = y + f.h / 2 + 4;
      ctx.strokeText(f.name, tx, ty);
      ctx.fillText(f.name, tx, ty);
      ctx.restore();
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

onValue(ref(db,'aquarium/baits'),s=>{
  BAITS.length=0;
  const v=s.val()||{};
  for(const k of Object.keys(v)){
    if(!v[k]||!v[k].img)continue;
    const im=new Image();im.src=v[k].img;BAITS.push(im);
  }
});
let artReady=false;
(async()=>{
  try{
    const man=await (await fetch(ASSET_DIR+'manifest.json')).json();
    const load=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src});
    ART.bg=await load(ASSET_DIR+'bg_water.jpg');
    ART.appleRed=await load(ASSET_DIR+'apple_red.png');
    ART.appleGold=await load(ASSET_DIR+'apple_gold.png');
    for(const k of ['weed','rock','pebble','bubble','stream']){
      ART[k]=(await Promise.all((man[k]||[]).map(o=>load(ASSET_DIR+o.f)))).filter(Boolean);
    }
    artReady=!!ART.bg;
  }catch(e){console.warn('素材を読み込めませんでした',e)}
})();

function hash(n,i){let x=(Number(n)||1)^(i*0x9e3779b9);x=Math.imul(x^(x>>>16),0x21f0aaad);x=Math.imul(x^(x>>>15),0x735a2d97);return(x^(x>>>15))>>>0}
function rnd(seed){let x=seed>>>0;return()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
async function prepEntrants(arr){await Promise.all((arr||[]).slice(0,5).map(async e=>{const k=`${e.tank}:${e.id}`;if(images.has(k))return;const im=new Image();im.src=e.img;try{await im.decode();images.set(k,im)}catch{}}))}

onValue(ref(db,'aquarium/race'),async s=>{
  const v=s.val()||{status:'idle'}; state=v;
  const entrants=(v.entrants||[]).slice(0,5); await prepEntrants(entrants);
  if(v.status==='staged')race=makeRace(v,entrants,true);
  else if((v.status==='countdown'||v.status==='running')&&(!race||race.nonce!==v.nonce))race=makeRace(v,entrants,false);
  else if(v.status==='idle')race=null;
});

function makeRace(v,entrants,staged){
  const rrCourse=rnd(hash(v.nonce,777));
  const objects=[],midObjects=[],bubbles=[];
  // 前景：海底に岩・わかめを並べる
  for(let k=0;k<COURSE_SCREENS;k++){
    for(let m=0;m<3;m++){
      const t=rrCourse();
      objects.push({kind:t<.42?'weed':t<.78?'rock':'pebble',
        idx:Math.floor(rrCourse()*99),
        x:k+(m+rrCourse()*.9)/3,
        y:.885+rrCourse()*.055,
        scale:.55+rrCourse()*.6,
        flip:rrCourse()<.5});
    }
    // 中景：小さく薄い岩・海藻
    for(let m=0;m<2;m++){
      midObjects.push({kind:rrCourse()<.55?'weed':'rock',
        idx:Math.floor(rrCourse()*99),
        x:k+(m+rrCourse())/2,
        y:.80+rrCourse()*.05,
        scale:.30+rrCourse()*.28,
        flip:rrCourse()<.5});
    }
    // 泡
    bubbles.push({kind:rrCourse()<.45?'stream':'bubble',idx:Math.floor(rrCourse()*99),
      x:k+rrCourse(),y:.12+rrCourse()*.6,scale:.45+rrCourse()*.6,
      sp:.10+rrCourse()*.16,ph:rrCourse()*6.28});
  }
  const now=performance.now();
  return {nonce:v.nonce,staged,finished:false,finishOrder:[],startPerf:now+3400,camera:0,objects,midObjects,bubbles,
    fishingPlanned: true, fishingTriggered:false, fishingTarget:null, fishingReturnAt:0, fishingReturnTop:false,
    racers:entrants.map((e,i)=>{
      const rr=rnd(hash(v.nonce,i+1));
      const training=1+(Math.max(.75,Math.min(1.6,Number(e.spd||1)))-1)*.16;
      const obs=[];for(let p=2.1;p<COURSE_SCREENS-1;p+=2.5+rr()*1.5)obs.push({x:p+rr()*.8,kind:rr()<.5?'rock':'weed',idx:Math.floor(rr()*99),flip:rr()<.5});
      const food=[];for(let p=3.2;p<COURSE_SCREENS-1;p+=4+rr()*2){
        const t=rr();
        food.push({x:p+rr()*.8,idx:Math.floor(rr()*997),kind:t<.30?'red':'other',ph:rr()*6.28});
      }
      return{e,i,world:.18,phase:rr()*6.28,base:(COURSE_SCREENS-.9)/RACE_SECONDS*(.94+rr()*.12)*training,jitter:0,lastJitter:0,pause:0,foodText:0,hitText:0,dash:0,dashText:0,finished:false,obstacles:obs,foods:food,hitOb:new Set(),hitFood:new Set(),lane:i,fishing:false,fishT:0};
    })};
}

function sizeMul(e){const base={s:.72,m:1,l:1.16,xl:1.30}[e.size]||1;const g=Math.max(.70,Math.min(1.52,1+(Number(e.grow||1)-1)*.42));return base*g}
function laneY(i){const top=H*.20,bottom=H*.82;return top+(bottom-top)*(i+.5)/5}
function screenX(world){return (world-race.camera)*W}

function drawSprite(list,idx,cx,cy,targetH,flip,alpha){
  if(!list||!list.length)return;
  const im=list[idx%list.length];if(!im||!im.width)return;
  const sc=targetH/im.height,w=im.width*sc,h=targetH;
  ctx.save();ctx.globalAlpha=alpha??1;ctx.translate(cx,cy);if(flip)ctx.scale(-1,1);
  ctx.drawImage(im,-w/2,-h,w,h);ctx.restore();
}
function drawWaterBase(now){
  ctx.clearRect(0,0,W,H);
  if(artReady&&ART.bg){
    // 横につながる背景をループさせる（遠景なのでゆっくり流れる）
    const im=ART.bg,sc=H/im.height,tw=im.width*sc;
    let off=(((race?.camera||0)*W*.30)%tw+tw)%tw;
    for(let x=-off;x<W+1;x+=tw)ctx.drawImage(im,x,0,tw+1,H);
  }else{
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b7898');g.addColorStop(.58,'#07516f');g.addColorStop(1,'#032737');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#183f42';ctx.fillRect(0,H*.88,W,H*.12);
  }
  // 水中の光の筋
  ctx.save();ctx.globalAlpha=.07;ctx.strokeStyle='#eafdff';ctx.lineWidth=Math.max(3,W*.004);
  const shift=((race?.camera||0)*W*.42)%210;
  for(let x=-260;x<W+260;x+=210){ctx.beginPath();ctx.moveTo(x-shift,0);ctx.lineTo(x+210-shift,H*.62);ctx.stroke()}
  ctx.restore();
}
function drawParallax(){
  if(!race)return;
  if(artReady){
    // 中景：手前よりゆっくり流れる岩と海藻
    const P=.62;
    for(const o of race.midObjects){
      const x=(o.x-race.camera*P)*W;
      if(x<-W*.3||x>W*1.3)continue;
      drawSprite(ART[o.kind],o.idx,x,H*o.y+H*.10,H*o.scale*.42,o.flip,.42);
    }
  }
}
function drawBubbles(now){
  if(!race||!artReady)return;
  const P=.85;
  for(const b of race.bubbles){
    const x=(b.x-race.camera*P)*W;
    if(x<-W*.25||x>W*1.25)continue;
    const drift=Math.sin(now/1400+b.ph)*W*.006;
    const span=H*.5,t=((now*b.sp*.05)%span)/span;
    const y=H*b.y-t*span;
    const fade=Math.min(1,t/.15,(1-t)/.2);   // 上下端でうっすら消える
    drawSprite(ART[b.kind],b.idx,x+drift,y+H*.18,H*b.scale*(b.kind==='stream'?.34:.11),false,.5*Math.max(0,fade));
  }
}
function drawCourseObjects(){
  if(!race)return;
  if(artReady){
    for(const o of race.objects){
      const x=screenX(o.x);
      if(x<-W*.35||x>W*1.35)continue;
      const hh=H*o.scale*(o.kind==='weed'?.30:o.kind==='rock'?.20:.075);
      drawSprite(ART[o.kind],o.idx,x,H*o.y,hh,o.flip,.97);

  }
  // START / GOAL
  ctx.textAlign='center';
  const sx=screenX(.05);
  if(sx>-140&&sx<W+140){ctx.fillStyle='rgba(255,255,255,.92)';ctx.font=`900 ${Math.max(20,H*.034)}px sans-serif`;ctx.fillText('START',sx,H*.10);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(sx,H*.13);ctx.lineTo(sx,H*.86);ctx.stroke()}
  const gx=screenX(COURSE_SCREENS-.45);
  if(gx>-200&&gx<W+200){ctx.font=`${Math.max(34,H*.08)}px sans-serif`;ctx.fillText('🏁',gx,H*.16);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(gx,H*.13);ctx.lineTo(gx,H*.86);ctx.stroke()}
}
function drawObstacles(){
  if(!race)return;
  for(const r of race.racers){
    for(let j=0;j<r.obstacles.length;j++){
      if(r.hitOb.has(j))continue;
      const o=r.obstacles[j],x=screenX(o.x);
      if(x<-120||x>W+120)continue;

      else{ctx.save();ctx.textAlign='center';ctx.font=`${Math.max(22,H*.05)}px sans-serif`;ctx.fillText(o.kind==='weed'?'🌿':'🪨',x,y);ctx.restore()}
    }

function drawShinyApple(im,x,y,hh,t,gold){
  const sc=hh/im.height,w=im.width*sc;
  const c1=gold?'rgba(255,232,140,':'rgba(255,120,95,';
  const c2=gold?'#fff6cf':'#ffd9cc';
  ctx.save();
  // ふんわりした光
  const pulse=.55+Math.abs(Math.sin(t*2.1))*.45;
  const rad=hh*(gold?1.15:.92)*(.92+pulse*.12);
  const g=ctx.createRadialGradient(x,y,rad*.12,x,y,rad);
  g.addColorStop(0,c1+(gold?.85:.55)*pulse+')');
  g.addColorStop(.5,c1+(gold?.35:.20)*pulse+')');
  g.addColorStop(1,c1+'0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();
  // りんご本体（ふわふわ上下）
  ctx.drawImage(im,x-w/2,y-hh/2+Math.sin(t*1.7)*hh*.05,w,hh);
  // きらめき（十字の光）
  const n=gold?5:3;
  for(let i=0;i<n;i++){
    const a=t*(gold?1.6:1.1)+i*(Math.PI*2/n);
    const rr=hh*(gold?.62:.52);
    const sx=x+Math.cos(a)*rr, sy=y+Math.sin(a)*rr*.85;
    const tw=(Math.sin(t*4.5+i*2.1)+1)/2;          // 明滅
    const s2=hh*(gold?.12:.09)*(.35+tw*.65);
    ctx.globalAlpha=.35+tw*.65;
    ctx.fillStyle=c2;
    ctx.beginPath();
    ctx.moveTo(sx,sy-s2*2.2);ctx.lineTo(sx+s2*.55,sy);
    ctx.lineTo(sx,sy+s2*2.2);ctx.lineTo(sx-s2*.55,sy);
    ctx.closePath();ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx-s2*2.2,sy);ctx.lineTo(sx,sy-s2*.55);
    ctx.lineTo(sx+s2*2.2,sy);ctx.lineTo(sx,sy+s2*.55);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawRaceFoods(){
  if(!race)return;
  const now=performance.now();
  for(const r of race.racers){
    for(let j=0;j<r.foods.length;j++){
      if(r.hitFood.has(j))continue;
      const f=r.foods[j],x=screenX(f.x);
      if(x<-90||x>W+90)continue;
      const y=laneY(r.i)+Math.sin(now/520+f.ph)*4;
      if(f.kind==='red'&&ART.appleRed){
        drawShinyApple(ART.appleRed,x,y,H*.078,now/1000+f.ph,false);
      }else{
        const lst=baitList(),im=lst.length?lst[f.idx%lst.length]:null;
        if(im&&im.complete&&im.width){
          const hh=H*.07,sc=hh/im.height,w=im.width*sc;
          ctx.save();ctx.globalAlpha=.97;ctx.drawImage(im,x-w/2,y-hh/2,w,hh);ctx.restore();
        }

}
const DROP_TIME=0.85;
const DASH_TIME=2.2;        // 赤りんごのダッシュ時間
const FINALE_AT=10;         // 残り何秒でラストイベントを起こすか
const MASS_FISH_CHANCE=0.10;  // ラスト10秒に最下位以外が全員釣られる確率
const GOLD_CHANCE=0.10;       // ラスト10秒に最下位へ金のりんごが出る確率
const splashes=[];
function goldBurst(x,y){
  const k=H/900;
  splashes.push({t:'ring',x,y,life:0,dur:.7,r0:12*k,r1:200*k,gold:true});
  splashes.push({t:'ring',x,y,life:-.1,dur:.6,r0:8*k,r1:130*k,gold:true});
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2,sp=(150+Math.random()*420)*k;
    splashes.push({t:'gold',x,y,life:0,dur:.6+Math.random()*.5,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,sz:(3+Math.random()*5)*k});
  }
}
function makeSplash(x,y){
  const k=H/900;
  splashes.push({t:'ring',x,y,life:0,dur:.65,r0:14*k,r1:150*k});
  splashes.push({t:'ring',x,y,life:-.12,dur:.6,r0:8*k,r1:95*k});
  for(let i=0;i<26;i++){
    const a=-Math.PI/2+(Math.random()-.5)*2.4;
    const sp=(180+Math.random()*430)*k;
    splashes.push({t:'drop',x,y,life:0,dur:.55+Math.random()*.5,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,sz:(2.5+Math.random()*4)*k});
  }
}
function drawSplashes(dt){
  for(let i=splashes.length-1;i>=0;i--){
    const p=splashes[i];p.life+=dt;
    if(p.life<0)continue;
    const u=p.life/p.dur;
    if(u>=1){splashes.splice(i,1);continue}
    ctx.save();
    if(p.t==='ring'){
      const r=p.r0+(p.r1-p.r0)*(1-Math.pow(1-u,3));
      ctx.globalAlpha=(1-u)*.8;ctx.strokeStyle=p.gold?'#ffe27a':'#ffffff';
      ctx.lineWidth=Math.max(2,7*(1-u));
      ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.34,0,0,Math.PI*2);ctx.stroke();
    }else if(p.t==='gold'){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;
      ctx.globalAlpha=1-u;ctx.fillStyle='#fff3c4';
      const s2=p.sz*(1-u*.5);
      ctx.beginPath();
      ctx.moveTo(p.x,p.y-s2*2.4);ctx.lineTo(p.x+s2*.6,p.y);
      ctx.lineTo(p.x,p.y+s2*2.4);ctx.lineTo(p.x-s2*.6,p.y);
      ctx.closePath();ctx.fill();
    }else{
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=760*(H/900)*dt;
      ctx.globalAlpha=1-u;ctx.fillStyle='#eafcff';
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(1-u*.4),0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}
function drawDropping(now){
  if(!race)return;
  for(const r of race.racers){
    if(!r.dropping)continue;
    const e=r.e,im=images.get(`${e.tank}:${e.id}`);if(!im)continue;
    const mul=sizeMul(e),baseH=H*.095*mul;
    const sc=Math.min(W*.11/im.width,baseH/im.height),dw=im.width*sc,dh=im.height*sc;
    const x=Math.max(W*.13,Math.min(W*.82,screenX(r.world)));
    const target=laneY(r.i);
    const u=Math.min(1,r.dropT/DROP_TIME);
    const y=-dh*.8+(target+dh*.8)*(u*u);          // 加速しながら落下
    ctx.save();ctx.translate(x,y);
    ctx.rotate(Math.sin(r.dropT*13)*.35);          // くるくる回りながら
    if(e.face!==1)ctx.scale(-1,1);
    ctx.drawImage(im,-dw/2,-dh/2,dw,dh);ctx.restore();
    ctx.save();ctx.textAlign='center';
    ctx.font=`900 ${Math.max(16,H*.026)}px sans-serif`;
    ctx.lineWidth=6;ctx.strokeStyle='rgba(2,20,32,.9)';ctx.fillStyle='#ffd86b';

    ctx.restore();
  }
}

function drawSpeedStreaks(now){if(!race||race.staged)return;const elapsed=(now-race.startPerf)/1000;if(elapsed<0)return;ctx.save();ctx.globalAlpha=.13;ctx.strokeStyle='#eafdff';ctx.lineWidth=2;const speed=Math.min(1,elapsed/4);for(let i=0;i<18;i++){const y=((i*47+now*.08)%H);const len=(30+(i%6)*16)*speed;const x=((i*113-now*.22*(2+i%3))%(W+220)+W+220)%(W+220);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-len,y);ctx.stroke()}ctx.restore()}

  if(!race.staged&&!r.finished){ctx.save();ctx.globalAlpha=.55;ctx.fillStyle='#dffaff';for(let j=0;j<3;j++){const bx=x-dw*.58-j*13-(now*.08+j*31)%18,by=y+((j%2)?-1:1)*dh*.16;ctx.beginPath();ctx.arc(bx,by,2+j,0,Math.PI*2);ctx.fill()}ctx.restore()}
  ctx.textAlign='center';ctx.font=`800 ${Math.max(13,H*.020)}px sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(2,20,32,.88)';ctx.fillStyle='#fff';ctx.strokeText(e.name||'(なまえなし)',x,y+dh*.68+15);ctx.fillText(e.name||'(なまえなし)',x,y+dh*.68+15);
  if(r.dashText>0){ctx.font=`900 ${Math.max(14,H*.022)}px sans-serif`;ctx.lineWidth=5;ctx.strokeStyle='rgba(60,10,0,.9)';ctx.fillStyle='#ff9c7a';ctx.strokeText('ダッシュ！',x,y-dh*.75-10);ctx.fillText('ダッシュ！',x,y-dh*.75-10)}
  if(r.foodText>0||r.hitText>0){const txt=r.foodText>0?'もぐもぐ…':'💥';ctx.font=`900 ${Math.max(13,H*.019)}px sans-serif`;ctx.fillStyle=r.foodText>0?'#ffeaa5':'#ffd0c7';ctx.fillText(txt,x,y-dh*.72-10)}
}

function updateRace(dt,now){if(!race||race.staged||race.finished)return;if(now<race.startPerf)return;
  if(state.status==='countdown')update(ref(db,'aquarium/race'),{status:'running'}).catch(()=>{});
  const elapsed=(now-race.startPerf)/1000;
  // レース残り30秒で一度だけ、その時点のトップが必ず釣られる
  if(!race.fishingTriggered && elapsed>=RACE_SECONDS-30){
    race.fishingTriggered=true;
    if(race.fishingPlanned){
      const active=race.racers.filter(r=>!r.finished);
      if(active.length){
        const target=active.reduce((a,b)=>a.world>=b.world?a:b);
        target.fishing=true; target.fishT=0; target.pause=0;
        race.fishingTarget=target;
        race.fishingReturnAt=RACE_SECONDS-10;
        const rrFish=rnd(hash(race.nonce,9091));
        race.fishingReturnTop=rrFish()<0.20;
      }
    }
  }
  // ラスト10秒のイベント（金のりんご／一斉釣り上げはそれぞれ独立に抽選）
  if(!race.finaleTriggered && elapsed>=RACE_SECONDS-FINALE_AT){
    race.finaleTriggered=true;
    const rrF=rnd(hash(race.nonce,4649));
    const goldHit=rrF()<GOLD_CHANCE;
    const massHit=rrF()<MASS_FISH_CHANCE;
    const active=race.racers.filter(r=>!r.finished&&!r.fishing&&!r.dropping);
    const lastOne=active.length?active.reduce((a,b)=>a.world<=b.world?a:b):null;
    if(goldHit && lastOne){
      // 最下位の少し前に金のりんごを出す。触れたら発動
      race.goldApple={owner:lastOne,x:lastOne.world+.32,taken:false,t:0};
    }
    if(massHit && active.length>=2){
      for(const r of active){
        if(r===lastOne)continue;
        r.fishing=true;r.fishT=0;r.pause=0;r.massFished=true;
      }
      race.massFishAt=elapsed;
    }
  }
  // 金のりんごに追いついたら発動
  if(race.goldApple&&!race.goldApple.taken){
    const ga=race.goldApple;ga.t+=dt;
    const o=ga.owner;
    if(!o.fishing&&!o.dropping&&o.world>=ga.x){
      ga.taken=true;o.golden=true;o.goldT=0;
      goldBurst(Math.max(W*.13,Math.min(W*.82,screenX(ga.x))),laneY(o.i));
    }
  }
  // 一斉に釣られた魚を戻す
  if(race.massFishAt && elapsed>=race.massFishAt+3.2){
    race.massFishAt=0;
    for(const r of race.racers){
      if(!r.massFished)continue;
      r.massFished=false;r.fishing=false;r.fishT=0;
      r.dropping=true;r.dropT=0;r.pause=DROP_TIME;
    }
  }
  if(race.fishingTarget && race.fishingTarget.fishing){
    const fr=race.fishingTarget;fr.fishT+=dt;
    if(elapsed>=race.fishingReturnAt){
      const others=race.racers.filter(r=>r!==fr&&!r.finished);
      if(others.length){
        const lead=Math.max(...others.map(r=>r.world));
        const last=Math.min(...others.map(r=>r.world));
        fr.world=race.fishingReturnTop ? Math.min(COURSE_SCREENS-.75,lead+.05) : Math.max(.25,last-.08);
      }
      fr.fishing=false;fr.fishT=0;race.fishingTarget=null;
      // 上から落ちてきて水しぶきを上げる
      fr.dropping=true;fr.dropT=0;fr.pause=DROP_TIME;
      splashes.length=0;
    }
  }
  // 落下の進行と着水
  for(const r of race.racers){
    if(!r.dropping)continue;
    r.dropT+=dt;
    if(r.dropT>=DROP_TIME){
      r.dropping=false;
      makeSplash(Math.max(W*.13,Math.min(W*.82,screenX(r.world))),laneY(r.i));
    }
  }
  for(const r of race.racers){if(r.finished||r.fishing||r.dropping)continue;r.foodText=Math.max(0,r.foodText-dt);r.hitText=Math.max(0,r.hitText-dt);if(r.pause>0){r.pause-=dt;continue}
    if(elapsed-r.lastJitter>1.25){const rr=rnd(hash(race.nonce+Math.floor(elapsed*13),r.i+99));r.jitter=(rr()-.5)*.30;r.lastJitter=elapsed}
    let v=r.base*(1+r.jitter);if(elapsed>72)v*=1.10+((4-r.i)*.008);
    if(r.dash>0){r.dash-=dt;r.dashText=Math.max(0,r.dashText-dt);v*=2.35}
    if(r.golden){r.goldT+=dt;v*=3.6}
    r.world+=v*dt;
    for(let j=0;j<r.obstacles.length;j++){if(!r.hitOb.has(j)&&r.world>=r.obstacles[j].x){r.hitOb.add(j);const rr=rnd(hash(race.nonce+j*43,r.i+101));const sizePenalty=Math.max(0,Number(r.e.grow||1)-1)*.07;if(rr()<Math.min(.80,.53+sizePenalty)){r.pause=.45+rr()*1.55;r.hitText=r.pause+.25}else r.world+=.08}}
    for(let j=0;j<r.foods.length;j++){
      const fd=r.foods[j];
      if(r.hitFood.has(j)||r.world<fd.x)continue;
      r.hitFood.add(j);
      const rr=rnd(hash(race.nonce+j*71,r.i+201));
      if(fd.kind==='red'){                       // 赤りんご＝ダッシュ
        r.dash=DASH_TIME;r.dashText=DASH_TIME;
      }else if(rr()<.58){                        // その他＝ランダムで足止め
        r.pause=1.0+rr()*2.5;r.foodText=r.pause+.4;
      }
    }
    if(r.world>=COURSE_SCREENS-.45){r.world=COURSE_SCREENS-.45;r.finished=true;r.finishT=elapsed;race.finishOrder.push(r)}
  }
  // カメラは先頭集団を追う。急に飛ばず滑らかに追従
  // カメラはゴール済みも含めた先頭を追う。後ろには戻さない
  const lead=Math.max(...race.racers.map(r=>r.world));
  const target=Math.max(0,Math.min(COURSE_SCREENS-1.05,lead-.70));
  race.camTarget=Math.max(race.camTarget??0,target);      // 目標は前にしか進まない
  race.camera+=(race.camTarget-race.camera)*Math.min(1,dt*2.8);
  if(race.finishOrder.length===race.racers.length){race.finished=true;reportResults()}
}
async function reportResults(){if(!race||reportedNonce===race.nonce)return;reportedNonce=race.nonce;const top=race.finishOrder.slice(0,5).map((r,i)=>({rank:i+1,name:r.e.name||'(なまえなし)',id:r.e.id,tank:r.e.tank,time:Number(r.finishT.toFixed(3))}));const snap=await get(ref(db,'aquarium/race')),cur=snap.val()||{};if(cur.nonce===race.nonce&&cur.status!=='finished')await update(ref(db,'aquarium/race'),{status:'finished',results:top,total:5,finishedAt:Date.now()})}

function drawCountdown(now){if(!race||race.staged)return;const left=(race.startPerf-now)/1000;if(left<=0)return;const txt=left>2.4?'3':left>1.6?'2':left>.8?'1':'START!';ctx.fillStyle='rgba(0,0,0,.38)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${Math.min(W*.18,H*.23)}px sans-serif`;ctx.lineWidth=14;ctx.strokeStyle='#073044';ctx.fillStyle=txt==='START!'?'#ffd86b':'#fff';ctx.strokeText(txt,W/2,H/2);ctx.fillText(txt,W/2,H/2)}
function drawWaiting(){if(!race||!race.staged)return;ctx.fillStyle='rgba(0,0,0,.36)';ctx.fillRect(W*.20,H*.04,W*.60,H*.085);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(18,H*.030)}px sans-serif`;ctx.fillText(race.racers.length===5?'5匹そろいました！ 出走待機中':'出走魚を選抜中…',W/2,H*.082)}
function drawHud(now){if(!race||race.staged||race.finished)return;const elapsed=Math.max(0,(now-race.startPerf)/1000),remain=Math.max(0,RACE_SECONDS-elapsed);const leader=Math.max(...race.racers.map(r=>r.world));const prog=Math.max(0,Math.min(1,leader/(COURSE_SCREENS-.45)));ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(W*.02,H*.025,W*.34,H*.075);ctx.fillStyle='#fff';ctx.font=`800 ${Math.max(16,H*.024)}px monospace`;ctx.textAlign='left';ctx.fillText(`残り ${Math.ceil(remain)}秒`,W*.035,H*.058);ctx.fillStyle='rgba(255,255,255,.24)';ctx.fillRect(W*.035,H*.074,W*.30,H*.010);ctx.fillStyle='#8fe3d6';ctx.fillRect(W*.035,H*.074,W*.30*prog,H*.010)}
function drawResults(){if(!race||!race.finished)return;ctx.fillStyle='rgba(1,15,25,.78)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ffd86b';ctx.font=`900 ${Math.max(30,H*.065)}px sans-serif`;ctx.fillText('🏆 RESULT 🏆',W/2,H*.16);race.finishOrder.slice(0,5).forEach((r,i)=>{ctx.fillStyle=i===0?'#ffd86b':'#fff';ctx.font=`800 ${Math.max(17,H*(i===0?.040:.029))}px sans-serif`;ctx.fillText(`${i+1}位　${r.e.name||'(なまえなし)'}`,W/2,H*(.29+i*.105))})}
function drawIdle(){ctx.clearRect(0,0,W,H);
  if(artReady&&ART.bg){const im=ART.bg,sc=H/im.height,tw=im.width*sc;for(let x=0;x<W+1;x+=tw)ctx.drawImage(im,x,0,tw+1,H);ctx.fillStyle='rgba(2,25,40,.35)';ctx.fillRect(0,0,W,H);}
  else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b7898');g.addColorStop(1,'#032737');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,.8)';ctx.font=`800 ${Math.max(24,H*.045)}px sans-serif`;ctx.fillText('レース管理画面で出走準備してください',W/2,H*.52)}

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(race){updateRace(dt,now);drawWaterBase(now);drawParallax();drawCourseObjects();drawObstacles();drawRaceFoods();drawGoldApple(now);drawBubbles(now);drawSpeedStreaks(now);race.racers.forEach(r=>drawFish(r,now));drawFishing(now);drawDropping(now);drawSplashes(dt);drawWaiting();drawCountdown(now);drawHud(now);drawResults()}else drawIdle();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水族館 管理</title>
<style>
  :root{
    --abyss:#04202f; --deep:#0a3a52; --panel:#0d4a63;
    --foam:#8fe3d6; --sand:#f2e4c9; --coral:#ff7a5c; --ink:#031a26;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:16px 14px 60px;
    background:linear-gradient(180deg,var(--deep),var(--abyss) 60%);
    color:var(--sand);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
    min-height:100vh;
  }
  h1{font-size:20px;letter-spacing:.14em;margin:0 0 4px}
  .sub{font-size:12px;opacity:.65;margin:0 0 18px}

  .tanks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tankbtn{
    border:2px solid rgba(143,227,214,.3);background:rgba(255,255,255,.06);color:var(--sand);
    border-radius:12px;padding:10px 14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;
  }
  .tankbtn .cnt{font-size:11px;opacity:.7;font-weight:500}
  .tankbtn.on{background:var(--foam);color:var(--ink);border-color:var(--foam)}
  .tankbtn.full{border-color:var(--coral)}
  .tankbtn.full .cnt{color:var(--coral);opacity:1}

  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .btn{
    border:none;border-radius:11px;padding:10px 16px;font-family:inherit;font-size:13px;font-weight:700;
    background:rgba(255,255,255,.12);color:var(--sand);cursor:pointer;
  }
  .btn.danger{background:var(--coral);color:#2a0a04}
  .btn:active{transform:translateY(1px)}
  .url{
    font-size:11px;opacity:.6;word-break:break-all;background:rgba(0,0,0,.25);
    padding:8px 10px;border-radius:8px;flex:1;min-width:220px;
  }
  .warn{
    background:rgba(255,122,92,.16);border:2px solid rgba(255,122,92,.55);
    border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.7;margin-bottom:14px;
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .card{
    background:rgba(255,255,255,.07);border-radius:14px;padding:10px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .card .thumb{
    width:100%;height:88px;display:flex;align-items:center;justify-content:center;
    background:repeating-conic-gradient(rgba(255,255,255,.06) 0% 25%,transparent 0% 50%) 50%/12px 12px;
    border-radius:9px;overflow:hidden;
  }
  .card img{max-width:100%;max-height:88px}
  .card .nm{font-size:13px;font-weight:700;text-align:center;word-break:break-all}
  .card .tm{font-size:10px;opacity:.5}
  .card button{
    width:100%;border:none;border-radius:9px;padding:7px;font-family:inherit;font-size:12px;
    background:rgba(255,122,92,.85);color:#2a0a04;font-weight:700;cursor:pointer;
  }
  .baitbox{
    background:rgba(255,255,255,.06);border:2px solid rgba(143,227,214,.25);
    border-radius:14px;padding:12px;margin-bottom:16px;
  }
  .baitbox h2{font-size:14px;margin:0 0 4px;letter-spacing:.1em}
  .baitbox p{font-size:11px;opacity:.6;margin:0 0 10px}
  .baits{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  .baitbtn{
    border:2px solid rgba(255,255,255,.15);background:rgba(0,0,0,.2);border-radius:12px;
    padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
    color:var(--sand);font-family:inherit;font-size:12px;font-weight:700;min-width:82px;
  }
  .baitbtn:hover{border-color:var(--foam)}
  .baitbtn img{height:44px;width:auto}
  .baitbtn em{font-style:normal;font-size:10px;font-weight:500;opacity:.6}
  .baitbtn#baitRandom,.baitbtn#baitStop{font-size:11px;line-height:1.45;justify-content:center}
  #baitMsg{font-size:12px;margin-top:10px;min-height:16px;color:var(--foam)}
  .baitbtn.on{border-color:var(--foam);background:rgba(143,227,214,.15)}
  .baitbtn .del{
    font-size:10px;opacity:.5;background:none;border:none;color:var(--sand);
    padding:0;width:auto;cursor:pointer;
  }
  .upload{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;
    padding-top:12px;border-top:1px solid rgba(255,255,255,.1);
  }
  .upload label{
    font-size:12px;font-weight:700;background:rgba(255,255,255,.12);color:var(--sand);
    padding:9px 14px;border-radius:10px;cursor:pointer;
  }
  .upload span{font-size:11px;opacity:.55}
  .target{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin-bottom:10px;font-size:12px;
  }
  .target select{
    flex:1;min-width:150px;padding:9px 10px;border-radius:10px;font-family:inherit;font-size:13px;
    background:rgba(0,0,0,.3);color:var(--sand);border:2px solid rgba(143,227,214,.3);
  }
  .card .grw{font-size:10px;color:var(--foam);font-weight:700}
  .card .btns{display:flex;gap:5px;width:100%}
  .card .btns button{flex:1}
  .card button.rst{background:rgba(255,255,255,.16);color:var(--sand)}
  .empty{opacity:.5;font-size:13px;padding:30px 0;text-align:center}
</style>
</head>
<body>
<h1>水族館 管理</h1>
<p class="sub">水槽は5個。1水槽あたり50匹まで（合計250匹）<br>水槽のタブを押すとOBSの表示も切り替わります</p>

<div id="warn" class="warn" style="display:none"></div>
<div class="tanks" id="tanks"></div>

<div class="bar">
  <button class="btn danger" id="delTank">この水槽を空にする</button>
  <button class="btn" id="resetMeals">エサやり回数だけリセット</button>
  <button class="btn" id="resetGrow">この水槽の育成を全部リセット</button>
  <button class="btn danger" id="delAll">全水槽を空にする</button>
  <div class="url" id="obsUrl"></div>
</div>

<div class="baitbox">
  <h2>エサをあげる</h2>
  <p>エサをあげる魚を選んでから、エサを押してください。食べると「大きくなる」か「すばやくなる」のどちらかが起きます。</p>
  <div class="target">
    <span class="label">あげる相手</span>
    <select id="targetSel"><option value="">みんな（群がるだけ・成長なし）</option></select>
  </div>
  <div class="baits">
    <button class="baitbtn" data-bait="worm"><img data-b="worm" alt=""><span>ミミズ</span><em>さかな用</em></button>
    <button class="baitbtn" data-bait="apple"><img data-b="apple" alt=""><span>りんご</span><em>クラゲ用</em></button>
    <button class="baitbtn" data-bait="meat"><img data-b="meat" alt=""><span>おにく</span><em>カニ用</em></button>
    <button class="baitbtn" id="baitRandom" style="min-width:78px">🎲<br>ランダム<br>1匹にあげる</button>
    <button class="baitbtn" id="baitStop" style="min-width:70px">✕<br>ひきあげる</button>
  </div>
  <div class="upload">
    <label>エサ画像を登録<input id="baitFile" type="file" accept="image/*" hidden></label>
    <span>PNG推奨（透過対応）。自動で縮小されます</span>
  </div>
  <div id="baitMsg"></div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">この水槽にはまだ魚がいません</div>

let customBaits = {};

let current = 1;
const counts = {};

/* ---------- 水槽タブ（index だけ読むので軽い） ---------- */
for (let t = 1; t <= SCAN_TANKS; t++){
  onValue(ref(db, `aquarium/tanks/${t}/index`), s => {
    counts[t] = s.exists() ? Object.keys(s.val()).length : 0;
    renderTanks();
  });
}

function renderTanks(){
  const box = document.getElementById('tanks');
  box.innerHTML = '';
  for (let t = 1; t <= SCAN_TANKS; t++){
    const n = counts[t] || 0;
    const b = document.createElement('button');
    b.className = 'tankbtn' + (t === current ? ' on' : '') + (n >= TANK_LIMIT ? ' full' : '');
    b.innerHTML = `水槽${t}<span class="cnt">${n} / ${TANK_LIMIT}${n>=TANK_LIMIT?' 満員':''}</span>`;
    b.onclick = () => {
      current = t; renderTanks(); loadFish();
      set(ref(db, 'aquarium/view/tank'), t).catch(()=>{});
    };
    box.appendChild(b);
  }

  const w = document.getElementById('warn');
  const fulls = Object.keys(counts).filter(t => counts[t] >= TANK_LIMIT);
  if (fulls.length){
    w.style.display = 'block';
    const next = [1,2,3,4,5].find(t => (counts[t]||0) < TANK_LIMIT);
    w.innerHTML = next
      ? `⚠️ 水槽${fulls.join('・')} が満員です。新しい魚は <b>水槽${next}</b> に入ります。`
      : `⚠️ 水槽${SCAN_TANKS}個すべてが満員です。どれかを空けないと新しい魚を受け付けられません。`;
  } else {
    w.style.display = 'none';
  }
  document.getElementById('obsUrl').innerHTML =
    `OBS用URL（この1本で全水槽を切り替え）：<br>${location.href.replace(/admin\.html.*$/, '')}display.html`;
}

/* ---------- 魚一覧 ---------- */
let unsub = null;
function loadFish(){
  if (unsub) unsub();
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="empty">読み込み中…</div>';
  unsub = onValue(ref(db, `aquarium/tanks/${current}/fish`), s => {
    grid.innerHTML = '';
    const val = s.exists() ? s.val() : {};
    const ids = Object.keys(val).sort((a,b) => (val[b].ts||0) - (val[a].ts||0));
    document.getElementById('empty').style.display = ids.length ? 'none' : 'block';

    // あげる相手のリストを更新
    const keep = targetSel.value;
    targetSel.innerHTML = '<option value="">みんな（群がるだけ・成長なし）</option>';
    for (const id of ids){
      const f = val[id];
      const g = f.grow ?? 1;
      const o = document.createElement('option');
      o.value = id;
      const me = f.meals ?? 0;
      o.textContent = (f.name || '(なまえなし)') + (me ? ` 🍽${me}` : '');
      targetSel.appendChild(o);
    }
    targetSel.value = keep && ids.includes(keep) ? keep : '';

    for (const id of ids){
      const f = val[id];
      const g = f.grow ?? 1;
      const card = document.createElement('div');
      card.className = 'card';
      const d = f.ts ? new Date(f.ts) : null;
      card.innerHTML = `
        <div class="thumb"><img src="${f.img}" alt=""></div>
        <div class="nm">${escapeHtml(f.name || '(なまえなし)')}</div>
        ${statLine(f)}
        <div class="tm">${d ? `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : ''}</div>
        <div class="btns">
          <button class="fd">エサ</button>
          ${(g > 1.01 || (f.spd ?? 1) > 1.01 || (f.meals ?? 0) > 0) ? '<button class="rst">もどす</button>' : ''}
          <button class="del2">削除</button>
        </div>`;
      card.querySelector('.del2').onclick = async () => {
        if (!confirm(`「${f.name}」を水槽から出しますか？`)) return;
        await remove(ref(db, `aquarium/tanks/${current}/fish/${id}`));
        await remove(ref(db, `aquarium/tanks/${current}/index/${id}`));
      };
      card.querySelector('.fd').onclick = () => {
        targetSel.value = id;
        const b = randomBaitKey();
        dropBait(b.key, b.name, b.img);
      };
      const rst = card.querySelector('.rst');
      if (rst) rst.onclick = async () => {
        await update(ref(db, `aquarium/tanks/${current}/fish/${id}`),
                     { grow: 1, spd: 1, meals: 0 });
      };
      grid.appendChild(card);
    }
  });
}
function statLine(f){
  const g = f.grow ?? 1, sp = f.spd ?? 1, me = f.meals ?? 0;
  if (!me) return '';
  const parts = [];
  if (g > 1.01) parts.push(`大きさ×${g.toFixed(2)}`);
  if (sp > 1.01) parts.push(`速さ×${sp.toFixed(2)}`);
  return `<div class="grw">🍽 ${me}こ${parts.length ? '　' + parts.join('　') : ''}</div>`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 一括削除 ---------- */
document.getElementById('delTank').onclick = async () => {
  if (!confirm(`水槽${current} の魚を全部出しますか？`)) return;
  await remove(ref(db, `aquarium/tanks/${current}`));
};
document.getElementById('resetMeals').onclick = async () => {
  const snap = await get(ref(db, `aquarium/tanks/${current}/fish`));
  if (!snap.exists()) return;
  const v = snap.val();
  const ids = Object.keys(v).filter(id => (v[id].meals ?? 0) > 0);
  if (!ids.length){ alert('エサをあげた記録がありません'); return; }
  if (!confirm(`水槽${current} の ${ids.length}匹 のエサやり回数を0にもどしますか？\n（大きさ・すばやさはそのまま）`)) return;
  await Promise.all(ids.map(id =>
    set(ref(db, `aquarium/tanks/${current}/fish/${id}/meals`), 0)));
};
document.getElementById('resetGrow').onclick = async () => {
  const snap = await get(ref(db, `aquarium/tanks/${current}/fish`));
  if (!snap.exists()) return;
  const ids = Object.keys(snap.val());
  if (!confirm(`水槽${current} の魚 ${ids.length}匹 の大きさ・すばやさ・食べた数を元に戻しますか？`)) return;
  await Promise.all(ids.map(id =>
    update(ref(db, `aquarium/tanks/${current}/fish/${id}`), { grow: 1, spd: 1, meals: 0 })));
};
document.getElementById('delAll').onclick = async () => {
  if (!confirm('すべての水槽を空にします。よろしいですか？')) return;
  if (!confirm('本当に全部消します。もう戻せません。')) return;
  await remove(ref(db, 'aquarium/tanks'));
};

/* ---------- エサ ---------- */
const baitMsg = document.getElementById('baitMsg');
const targetSel = document.getElementById('targetSel');

async function dropBait(type, label, img){
  const forId = targetSel.value || null;
  const payload = { type, x: 0.22 + Math.random() * 0.56, ts: Date.now() };
  if (forId) payload.forId = forId;
  if (img) payload.img = img;
  await set(ref(db, `aquarium/tanks/${current}/bait`), payload);
  const who = forId ? targetSel.options[targetSel.selectedIndex].text : 'みんな';
  baitMsg.textContent = `${who} に ${label} を落としました`;
  setTimeout(() => { baitMsg.textContent = ''; }, 4000);
}

// 登録済みのエサからランダムに1つ選ぶ
function randomBaitKey(){
  const keys = Object.keys(customBaits);
  if (keys.length){
    const k = keys[Math.floor(Math.random() * keys.length)];
    return { key: k, name: customBaits[k].name, img: customBaits[k].img };
  }
  const base = [['worm','ミミズ'],['apple','りんご'],['meat','おにく']];
  const b = base[Math.floor(Math.random() * base.length)];
  return { key: b[0], name: b[1], img: null };
}

function bindBaitButtons(){
  document.querySelectorAll('.baitbtn[data-bait]').forEach(b => b.onclick = () => {
    const key = b.dataset.bait;
    const label = b.querySelector('span').textContent;
    dropBait(key, label, customBaits[key]?.img);
  });
}
bindBaitButtons();

/* ---------- エサ画像の登録 ---------- */
document.getElementById('baitFile').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  baitMsg.textContent = '画像を処理中…';
  try{
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i); i.onerror = rej;
      i.src = URL.createObjectURL(file);
    });
    // 透明部分をトリム
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const cx = c.getContext('2d', { willReadFrequently:true });
    cx.drawImage(img, 0, 0);
    const d = cx.getImageData(0,0,c.width,c.height).data;
    let x0=c.width, y0=c.height, x1=-1, y1=-1;
    for (let y=0;y<c.height;y++) for (let x=0;x<c.width;x++){
      if (d[(y*c.width+x)*4+3] > 8){
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      }
    }
    if (x1 < 0){ x0=0; y0=0; x1=c.width-1; y1=c.height-1; }
    const cw = x1-x0+1, ch = y1-y0+1;
    const sc = Math.min(1, 190/cw, 190/ch);
    const o = document.createElement('canvas');
    o.width = Math.max(1, Math.round(cw*sc));
    o.height = Math.max(1, Math.round(ch*sc));
    const octx = o.getContext('2d');
    octx.imageSmoothingQuality = 'high';
    octx.drawImage(c, x0, y0, cw, ch, 0, 0, o.width, o.height);
    const dataUrl = o.toDataURL('image/png');

    const name = (prompt('エサの名前は？', file.name.replace(/\.[^.]+$/, '')) || 'エサ').slice(0, 8);
    const key = 'c' + Date.now();
    await set(ref(db, `aquarium/baits/${key}`), { name, img: dataUrl, ts: Date.now() });
    baitMsg.textContent = `「${name}」を登録しました`;
    setTimeout(() => { baitMsg.textContent = ''; }, 4000);
  }catch(err){
    console.error(err);
    baitMsg.textContent = '画像を読み込めませんでした';
  }
};

/* ---------- 登録済みエサの一覧 ---------- */
onValue(ref(db, 'aquarium/baits'), s => {
  customBaits = s.val() || {};
  document.querySelectorAll('.baitbtn.custom').forEach(b => b.remove());
  const box = document.querySelector('.baits');
  const stop = document.getElementById('baitStop');
  for (const [key, v] of Object.entries(customBaits)){
    const b = document.createElement('button');
    b.className = 'baitbtn custom';
    b.dataset.bait = key;
    b.innerHTML = `<img src="${v.img}" alt=""><span>${escapeHtml(v.name)}</span>
                   <button class="del">削除</button>`;
    b.querySelector('.del').onclick = async ev => {
      ev.stopPropagation();
      if (!confirm(`エサ「${v.name}」を削除しますか？`)) return;
      await remove(ref(db, `aquarium/baits/${key}`));
    };
    box.insertBefore(b, stop);
  }
  bindBaitButtons();
});
document.getElementById('baitRandom').onclick = async () => {
  const snap = await get(ref(db, `aquarium/tanks/${current}/fish`));
  const ids = snap.exists() ? Object.keys(snap.val()) : [];
  if (!ids.length){ baitMsg.textContent = 'この水槽にはさかながいません'; return; }
  targetSel.value = ids[Math.floor(Math.random() * ids.length)];
  const b = randomBaitKey();
  await dropBait(b.key, b.name, b.img);
};
document.getElementById('baitStop').onclick = async () => {
  await remove(ref(db, `aquarium/tanks/${current}/bait`));
  baitMsg.textContent = 'エサをひきあげました';
  setTimeout(() => { baitMsg.textContent = ''; }, 3000);
};

renderTanks();
loadFish();
</script>
